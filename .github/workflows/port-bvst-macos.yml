name: BVST - Analyze and Prepare macOS ARM64 Port

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BVST_FILE: downloads/BVST_FILE
  EXTRACT_DIR: extracted
  SOURCE_DIR: port-source
  ANALYSIS_DIR: analysis
  BUILD_DIR: build
  TOOLS_DIR: tools

jobs:

  # ==========================================================
  # JOB 1
  # Download / extract / analyze BVST
  # ==========================================================

  analyze-bvst:
    name: Analyze BVST Windows Application
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      # --------------------------------------------------------
      # Install system tools
      # --------------------------------------------------------

      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            7zip \
            binutils \
            file \
            jq \
            unzip \
            p7zip-full \
            cabextract \
            strings \
            tree \
            ripgrep \
            curl \
            wget \
            git \
            python3 \
            python3-pip

      # --------------------------------------------------------
      # Verify repository
      # --------------------------------------------------------

      - name: Verify BVST file
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Repository"
          echo "========================================"

          pwd

          echo
          echo "BVST path:"
          echo "$BVST_FILE"

          if [ ! -e "$BVST_FILE" ]; then
            echo "ERROR: BVST_FILE does not exist."
            exit 1
          fi

          echo
          echo "File information:"
          ls -lah "$BVST_FILE"

          echo
          echo "File type:"
          file "$BVST_FILE"

          echo
          echo "Git LFS status:"
          git lfs status || true

      # --------------------------------------------------------
      # Verify LFS object
      # --------------------------------------------------------

      - name: Verify Git LFS object
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking whether BVST_FILE is still an LFS pointer..."

          if head -c 100 "$BVST_FILE" | grep -q "git-lfs.github.com/spec"; then
            echo "Detected Git LFS pointer."
            echo "Pulling actual object..."

            git lfs install --local
            git lfs pull

          else
            echo "BVST_FILE is already a real file."
          fi

          echo
          echo "After LFS pull:"
          ls -lh "$BVST_FILE"

          echo
          file "$BVST_FILE"

          # Expected SHA256 from the repository
          EXPECTED_SHA256="65982ba6e43a06b0530100eb1e8c7edb52b4a15a2198b8b8c92d04717f3a884e"

          echo
          echo "Calculating SHA256..."

          ACTUAL_SHA256="$(
            sha256sum "$BVST_FILE" \
              | awk '{print $1}'
          )"

          echo "Expected:"
          echo "$EXPECTED_SHA256"

          echo "Actual:"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo
            echo "WARNING: SHA256 differs from expected LFS object."
            echo "The analysis will continue."
          else
            echo
            echo "SHA256 verified."
          fi

      # --------------------------------------------------------
      # Prepare directories
      # --------------------------------------------------------

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$EXTRACT_DIR" \
            "$SOURCE_DIR" \
            "$ANALYSIS_DIR" \
            "$BUILD_DIR" \
            "$TOOLS_DIR"

          mkdir -p \
            "$EXTRACT_DIR" \
            "$SOURCE_DIR" \
            "$ANALYSIS_DIR" \
            "$BUILD_DIR" \
            "$TOOLS_DIR"

      # --------------------------------------------------------
      # Identify archive
      # --------------------------------------------------------

      - name: Identify BVST archive
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BVST archive identification"
          echo "========================================"

          file "$BVST_FILE"

          echo
          echo "First bytes:"
          xxd -l 32 "$BVST_FILE" || true

          echo
          echo "Archive listing test..."

          7z l "$BVST_FILE" | head -100

      # --------------------------------------------------------
      # Extract RAR
      # --------------------------------------------------------

      - name: Extract BVST archive
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Extracting BVST"
          echo "========================================"

          7z x \
            "$BVST_FILE" \
            "-o$EXTRACT_DIR" \
            -y

          echo
          echo "Extraction completed."

          echo
          echo "Top-level directories:"
          find "$EXTRACT_DIR" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100

          echo
          echo "File count:"
          find "$EXTRACT_DIR" \
            -type f \
            | wc -l

          echo
          echo "Directory count:"
          find "$EXTRACT_DIR" \
            -type d \
            | wc -l

      # --------------------------------------------------------
      # Locate BVST6.exe
      # --------------------------------------------------------

      - name: Locate BVST6 executable
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for BVST6.exe"
          echo "========================================"

          BVST6_FOUND="$(
            find "$EXTRACT_DIR" \
              -type f \
              \( \
                -iname "BVST6.exe" \
                -o \
                -iname "BVST.exe" \
              \) \
              | head -1
          )"

          if [ -z "$BVST6_FOUND" ]; then
            echo "ERROR: BVST6 executable not found."

            echo
            echo "Executables found:"
            find "$EXTRACT_DIR" \
              -type f \
              -iname "*.exe" \
              | sort \
              | head -200

            exit 1
          fi

          echo "BVST6 found:"
          echo "$BVST6_FOUND"

          echo
          echo "File information:"
          file "$BVST6_FOUND"

          echo
          echo "Size:"
          ls -lh "$BVST6_FOUND"

          echo "BVST6=$BVST6_FOUND" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # PE analysis
      # --------------------------------------------------------

      - name: Analyze BVST6 PE executable
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANALYSIS_DIR/pe"

          echo "========================================"
          echo "PE analysis"
          echo "========================================"

          file "$BVST6" \
            | tee "$ANALYSIS_DIR/pe/bvst6-file.txt"

          echo
          echo "Architecture:"
          objdump -f "$BVST6" \
            | tee "$ANALYSIS_DIR/pe/bvst6-objdump.txt" \
            || true

          echo
          echo "PE headers:"
          objdump -x "$BVST6" \
            > "$ANALYSIS_DIR/pe/bvst6-headers.txt" \
            || true

          echo
          echo "Strings:"
          strings -n 6 "$BVST6" \
            > "$ANALYSIS_DIR/pe/bvst6-strings.txt" \
            || true

      # --------------------------------------------------------
      # Download ILSpy
      # --------------------------------------------------------

      - name: Download ILSpy 11
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TOOLS_DIR/ilspy"

          echo "========================================"
          echo "Downloading ILSpy"
          echo "========================================"

          curl -fsSL \
            --retry 5 \
            --retry-delay 3 \
            https://api.github.com/repos/icsharpcode/ILSpy/releases/latest \
            -o "$TOOLS_DIR/ilspy-release.json"

          VERSION="$(
            jq -r '.tag_name' \
              "$TOOLS_DIR/ilspy-release.json"
          )"

          echo "Latest ILSpy:"
          echo "$VERSION"

          echo
          echo "Available assets:"
          jq -r '.assets[].name' \
            "$TOOLS_DIR/ilspy-release.json"

          # ----------------------------------------------------
          # IMPORTANT:
          #
          # ILSpy v11 does NOT name the asset "ilspycmd".
          #
          # Actual asset:
          #
          # ILSpy_linux-x64_11.0.0.9375.zip
          # ----------------------------------------------------

          ASSET_URL="$(
            jq -r '
              .assets[]
              | select(
                  (.name | ascii_downcase | startswith("ilspy_linux-x64_"))
                  and
                  (.name | ascii_downcase | endswith(".zip"))
                )
              | .browser_download_url
            ' "$TOOLS_DIR/ilspy-release.json" \
            | head -1
          )"

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo
            echo "ERROR: ILSpy Linux x64 asset not found."

            echo
            echo "Available assets:"
            jq -r '.assets[] | .name' \
              "$TOOLS_DIR/ilspy-release.json"

            exit 1
          fi

          echo
          echo "ILSpy URL:"
          echo "$ASSET_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            "$ASSET_URL" \
            -o "$TOOLS_DIR/ilspy.zip"

          echo
          echo "Downloaded:"
          ls -lh "$TOOLS_DIR/ilspy.zip"

          echo
          echo "Extracting..."

          unzip -q \
            "$TOOLS_DIR/ilspy.zip" \
            -d "$TOOLS_DIR/ilspy"

          echo
          echo "Extracted files:"
          find "$TOOLS_DIR/ilspy" \
            -maxdepth 4 \
            -type f \
            -print

      # --------------------------------------------------------
      # Install .NET
      # --------------------------------------------------------

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --------------------------------------------------------
      # Locate ILSpyCmd
      # --------------------------------------------------------

      - name: Locate ILSpyCmd
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Locating ILSpyCmd"
          echo "========================================"

          ILSPYCMD="$(
            find "$TOOLS_DIR/ilspy" \
              -type f \
              \( \
                -name "ilspycmd" \
                -o \
                -name "ilspycmd.dll" \
              \) \
              | head -1
          )"

          if [ -z "$ILSPYCMD" ]; then
            echo
            echo "ERROR: ILSpyCmd not found."

            echo
            echo "Complete directory:"
            find "$TOOLS_DIR/ilspy" \
              -type f \
              -print

            exit 1
          fi

          echo "ILSpyCmd:"
          echo "$ILSPYCMD"

          if [[ "$ILSPYCMD" != *.dll ]]; then
            chmod +x "$ILSPYCMD"
          fi

          echo "ILSPYCMD=$ILSPYCMD" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Test ILSpy
      # --------------------------------------------------------

      - name: Test ILSpy
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Testing ILSpy"
          echo "========================================"

          echo "ILSPYCMD:"
          echo "$ILSPYCMD"

          if [[ "$ILSPYCMD" == *.dll ]]; then
            dotnet "$ILSPYCMD" --version
            dotnet "$ILSPYCMD" --help \
              | head -80
          else
            "$ILSPYCMD" --version
            "$ILSPYCMD" --help \
              | head -80
          fi

      # --------------------------------------------------------
      # Decompile BVST6
      # --------------------------------------------------------

      - name: Decompile BVST6
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Decompiling BVST6"
          echo "========================================"

          mkdir -p "$SOURCE_DIR/BVST6"

          echo "Input:"
          echo "$BVST6"

          echo
          echo "Output:"
          echo "$SOURCE_DIR/BVST6"

          if [[ "$ILSPYCMD" == *.dll ]]; then

            dotnet "$ILSPYCMD" \
              -p \
              -o "$SOURCE_DIR/BVST6" \
              "$BVST6"

          else

            "$ILSPYCMD" \
              -p \
              -o "$SOURCE_DIR/BVST6" \
              "$BVST6"

          fi

          echo
          echo "Decompilation completed."

          echo
          echo "C# files:"
          find "$SOURCE_DIR/BVST6" \
            -type f \
            -name "*.cs" \
            | wc -l

          echo
          echo "Project files:"
          find "$SOURCE_DIR/BVST6" \
            -type f \
            \( \
              -name "*.csproj" \
              -o \
              -name "*.sln" \
            \) \
            -print

      # --------------------------------------------------------
      # Analyze all Windows binaries
      # --------------------------------------------------------

      - name: Analyze Windows binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANALYSIS_DIR/binaries"

          echo "========================================"
          echo "Scanning Windows binaries"
          echo "========================================"

          find "$EXTRACT_DIR" \
            -type f \
            \( \
              -iname "*.exe" \
              -o \
              -iname "*.dll" \
            \) \
            | sort \
            > "$ANALYSIS_DIR/binaries/all-binaries.txt"

          echo "Total EXE/DLL:"
          wc -l "$ANALYSIS_DIR/binaries/all-binaries.txt"

          echo
          echo "PE / .NET classification..."

          : > "$ANALYSIS_DIR/binaries/dotnet-binaries.txt"
          : > "$ANALYSIS_DIR/binaries/native-binaries.txt"

          while IFS= read -r f; do

            TYPE="$(file -b "$f" || true)"

            if echo "$TYPE" | grep -qiE \
              'Mono/.Net assembly|\.Net assembly'; then

              echo "$f" \
                >> "$ANALYSIS_DIR/binaries/dotnet-binaries.txt"

            elif echo "$TYPE" | grep -qiE \
              'PE32|PE32\+'; then

              echo "$f" \
                >> "$ANALYSIS_DIR/binaries/native-binaries.txt"

            fi

          done < "$ANALYSIS_DIR/binaries/all-binaries.txt"

          echo
          echo ".NET binaries:"
          wc -l \
            "$ANALYSIS_DIR/binaries/dotnet-binaries.txt"

          echo
          echo "Native PE binaries:"
          wc -l \
            "$ANALYSIS_DIR/binaries/native-binaries.txt"

      # --------------------------------------------------------
      # Search Windows-specific APIs
      # --------------------------------------------------------

      - name: Analyze Windows API usage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANALYSIS_DIR/windows"

          echo "========================================"
          echo "Windows API analysis"
          echo "========================================"

          # Search decompiled source

          rg -n \
            -i \
            --glob "*.cs" \
            'DllImport|LibraryImport|kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|winmm|wininet|ws2_32' \
            "$SOURCE_DIR/BVST6" \
            > "$ANALYSIS_DIR/windows/pinvoke.txt" \
            || true

          rg -n \
            -i \
            --glob "*.cs" \
            'COM|Marshal\.|ComImport|GuidAttribute|Activator\.CreateInstance' \
            "$SOURCE_DIR/BVST6" \
            > "$ANALYSIS_DIR/windows/com.txt" \
            || true

          rg -n \
            -i \
            --glob "*.cs" \
            'System\.Windows\.Forms|Windows\.Forms|Form\b|Control\b|IWin32Window' \
            "$SOURCE_DIR/BVST6" \
            > "$ANALYSIS_DIR/windows/winforms.txt" \
            || true

          rg -n \
            -i \
            --glob "*.cs" \
            'DirectShow|AForge|VideoCaptureDevice|FilterGraph|IMediaControl|ICaptureGraphBuilder' \
            "$SOURCE_DIR/BVST6" \
            > "$ANALYSIS_DIR/windows/directshow.txt" \
            || true

          rg -n \
            -i \
            --glob "*.cs" \
            'Shockwave|Flash|SWF|ActiveX|AxShockwave|application/x-shockwave-flash' \
            "$SOURCE_DIR/BVST6" \
            > "$ANALYSIS_DIR/windows/flash.txt" \
            || true

          echo
          echo "Analysis completed."

      # --------------------------------------------------------
      # Search entire extracted application for technology
      # --------------------------------------------------------

      - name: Analyze application technologies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANALYSIS_DIR/technology"

          echo "========================================"
          echo "Technology detection"
          echo "========================================"

          find "$EXTRACT_DIR" \
            -type f \
            -print \
            > "$ANALYSIS_DIR/technology/all-files.txt"

          echo "File extensions:"
          awk '
            {
              n=$0
              sub(/^.*\//, "", n)
              if (n ~ /\./) {
                sub(/^.*\./, "", n)
                print tolower(n)
              }
            }
          ' "$ANALYSIS_DIR/technology/all-files.txt" \
            | sort \
            | uniq -c \
            | sort -nr \
            > "$ANALYSIS_DIR/technology/extensions.txt"

          echo
          echo "Flash/SWF references:"
          rg -n \
            -i \
            'shockwave|flash|swf|activex|application/x-shockwave-flash' \
            "$EXTRACT_DIR" \
            > "$ANALYSIS_DIR/technology/flash-references.txt" \
            || true

          echo
          echo "DirectShow references:"
          rg -n \
            -i \
            'directshow|quartz\.dll|AForge\.Video\.DirectShow' \
            "$EXTRACT_DIR" \
            > "$ANALYSIS_DIR/technology/directshow-references.txt" \
            || true

          echo
          echo "WinForms references:"
          rg -n \
            -i \
            'System\.Windows\.Forms|Windows\.Forms' \
            "$EXTRACT_DIR" \
            > "$ANALYSIS_DIR/technology/winforms-references.txt" \
            || true

      # --------------------------------------------------------
      # Inspect decompiled project
      # --------------------------------------------------------

      - name: Inspect generated project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANALYSIS_DIR/project"

          echo "========================================"
          echo "Generated project"
          echo "========================================"

          find "$SOURCE_DIR/BVST6" \
            -type f \
            | sort \
            > "$ANALYSIS_DIR/project/files.txt"

          find "$SOURCE_DIR/BVST6" \
            -type f \
            -name "*.csproj" \
            -exec sh -c '
              for f do
                echo "===== $f ====="
                cat "$f"
                echo
              done
            ' sh {} + \
            > "$ANALYSIS_DIR/project/csproj.txt" \
            || true

          echo
          echo "Namespaces:"
          rg -o \
            --no-filename \
            'namespace[[:space:]]+[A-Za-z0-9_.]+' \
            "$SOURCE_DIR/BVST6" \
            --glob "*.cs" \
            | sort \
            | uniq -c \
            | sort -nr \
            > "$ANALYSIS_DIR/project/namespaces.txt" \
            || true

      # --------------------------------------------------------
      # Generate migration report
      # --------------------------------------------------------

      - name: Generate macOS ARM64 migration report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$ANALYSIS_DIR/BVST-macOS-ARM64-Migration-Report.md"

          cat > "$REPORT" <<'EOF'
          # BVST → macOS ARM64 Migration Analysis

          ## Target

          Native Apple Silicon macOS application.

          Target runtime:

          `osx-arm64`

          Target architecture:

          `ARM64 / Apple Silicon`

          ---

          ## Original application

          The original BVST application is a Windows executable.

          Main executable:

          `BVST6.exe`

          ---

          ## Important

          This analysis does NOT claim that the Windows executable can simply be
          recompiled for ARM64.

          A native macOS port requires source-level migration.

          ---

          ## Migration categories

          ### 1. .NET managed code

          Potentially reusable after modification.

          Typical changes:

          - project format
          - target framework
          - Windows-only references
          - native interop
          - UI framework
          - filesystem paths
          - registry access
          - Windows services
          - COM dependencies

          ### 2. Windows Forms

          Windows Forms is Windows-specific.

          Any code depending on:

          `System.Windows.Forms`

          must be migrated to a cross-platform UI technology or rewritten.

          ### 3. Win32 / PInvoke

          Calls to:

          - kernel32
          - user32
          - gdi32
          - shell32
          - advapi32
          - ole32
          - winmm
          - wininet
          - ws2_32

          cannot simply be compiled for macOS.

          They need native macOS equivalents or removal.

          ### 4. COM / ActiveX

          COM and ActiveX components are Windows technologies.

          These require replacement on macOS.

          ### 5. DirectShow

          DirectShow is Windows-specific.

          Camera/video capture code should be migrated to:

          Apple AVFoundation

          or another cross-platform media abstraction.

          ### 6. AForge

          AForge.Video.DirectShow and related components normally depend on
          Windows video infrastructure.

          Camera capture therefore requires a platform-specific replacement.

          ### 7. Flash / SWF

          Any Shockwave Flash / ActiveX integration cannot be carried directly
          into a native macOS application.

          The actual UI/content usage must be identified before selecting a
          replacement.

          ### 8. Native DLLs

          PE32/PE32+ Windows DLLs cannot be loaded natively by macOS.

          They must be:

          - replaced
          - ported
          - rebuilt from source
          - or isolated behind another architecture/service

          ---

          ## Recommended port architecture

          Original:

          Windows .NET
          +
          WinForms
          +
          DirectShow
          +
          Windows APIs
          +
          possible Flash/ActiveX

          Target:

          .NET
          +
          cross-platform UI
          +
          macOS native interop
          +
          AVFoundation
          +
          replacement for Flash/ActiveX
          +
          ARM64 native dependencies

          ---

          ## Next stage

          The next automated stage should:

          1. Inspect the generated .csproj.
          2. Identify all NuGet dependencies.
          3. Identify all Windows-only namespaces.
          4. Identify every P/Invoke.
          5. Identify every COM interface.
          6. Identify camera/video code.
          7. Identify Flash/SWF code.
          8. Create a migration map.
          9. Create a new cross-platform project.
          10. Replace Windows-specific infrastructure.
          11. Build for `osx-arm64`.
          12. Package a `.app`.

          ---

          ## Important limitation

          Decompilation produces approximate source code.

          It does not restore the original source project, comments, build system,
          proprietary SDKs, certificates, or third-party source code.

          Therefore compilation errors after decompilation are expected and must
          be resolved during the migration stage.
          EOF

          echo
          echo "Migration report:"
          cat "$REPORT"

      # --------------------------------------------------------
      # Create analysis summary
      # --------------------------------------------------------

      - name: Generate analysis summary
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY="$ANALYSIS_DIR/SUMMARY.txt"

          {
            echo "BVST ANALYSIS SUMMARY"
            echo "====================="
            echo
            echo "Executable:"
            echo "$BVST6"
            echo
            echo "Executable type:"
            file "$BVST6"
            echo
            echo "Total files:"
            find "$EXTRACT_DIR" -type f | wc -l
            echo
            echo "Total directories:"
            find "$EXTRACT_DIR" -type d | wc -l
            echo
            echo ".NET binaries:"
            wc -l "$ANALYSIS_DIR/binaries/dotnet-binaries.txt"
            echo
            echo "Native binaries:"
            wc -l "$ANALYSIS_DIR/binaries/native-binaries.txt"
            echo
            echo "C# files generated:"
            find "$SOURCE_DIR/BVST6" \
              -type f \
              -name "*.cs" \
              | wc -l
            echo
            echo "WinForms references:"
            wc -l "$ANALYSIS_DIR/windows/winforms.txt" || true
            echo
            echo "PInvoke references:"
            wc -l "$ANALYSIS_DIR/windows/pinvoke.txt" || true
            echo
            echo "COM references:"
            wc -l "$ANALYSIS_DIR/windows/com.txt" || true
            echo
            echo "DirectShow references:"
            wc -l "$ANALYSIS_DIR/windows/directshow.txt" || true
            echo
            echo "Flash references:"
            wc -l "$ANALYSIS_DIR/windows/flash.txt" || true
          } > "$SUMMARY"

          cat "$SUMMARY"

      # --------------------------------------------------------
      # Create compressed analysis package
      # --------------------------------------------------------

      - name: Package analysis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$BUILD_DIR"

          tar -czf \
            "$BUILD_DIR/BVST-analysis.tar.gz" \
            "$ANALYSIS_DIR"

          echo
          echo "Analysis package:"
          ls -lh \
            "$BUILD_DIR/BVST-analysis.tar.gz"

      # --------------------------------------------------------
      # Upload reports and decompiled source
      # --------------------------------------------------------

      - name: Upload BVST analysis
        uses: actions/upload-artifact@v4
        with:
          name: BVST-analysis
          path: |
            analysis/
            port-source/BVST6/
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Upload archive analysis package
      # --------------------------------------------------------

      - name: Upload analysis archive
        uses: actions/upload-artifact@v4
        with:
          name: BVST-analysis-package
          path: build/BVST-analysis.tar.gz
          if-no-files-found: error
          retention-days: 30


  # ==========================================================
  # JOB 2
  # Prepare macOS ARM64 build environment
  # ==========================================================

  macos-arm64-prepare:
    name: Prepare macOS ARM64 Build
    runs-on: macos-14

    needs:
      - analyze-bvst

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      # --------------------------------------------------------
      # .NET
      # --------------------------------------------------------

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------

      - name: Inspect macOS ARM64 environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "macOS ARM64 environment"
          echo "========================================"

          sw_vers

          echo
          echo "Machine:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo ".NET:"
          dotnet --info

          echo
          echo "Available runtimes:"
          dotnet --list-runtimes

          echo
          echo "Available SDKs:"
          dotnet --list-sdks

      # --------------------------------------------------------
      # Verify ARM64
      # --------------------------------------------------------

      - name: Verify Apple Silicon architecture
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(uname -m)"

          echo "Architecture: $ARCH"

          if [ "$ARCH" != "arm64" ]; then
            echo "WARNING: Runner is not arm64."
          else
            echo "Apple Silicon ARM64 confirmed."
          fi

      # --------------------------------------------------------
      # Test native ARM64 .NET build
      # --------------------------------------------------------

      - name: Test osx-arm64 publishing
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/bvst-arm64-test"

          mkdir -p "$RUNNER_TEMP/bvst-arm64-test"

          cd "$RUNNER_TEMP/bvst-arm64-test"

          dotnet new console \
            -n BVSTArm64Test \
            --framework net8.0

          cd BVSTArm64Test

          dotnet publish \
            -c Release \
            -r osx-arm64 \
            --self-contained false

          echo
          echo "Published files:"
          find bin/Release \
            -type f \
            | sort

      # --------------------------------------------------------
      # Create migration skeleton
      # --------------------------------------------------------

      - name: Create macOS ARM64 project skeleton
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p macos-port

          cd macos-port

          dotnet new console \
            -n BVST.Mac \
            --framework net8.0

          cd BVST.Mac

          dotnet add package System.Drawing.Common \
            --version 8.0.0 \
            || true

          cat > BVST.Mac.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>

              <RuntimeIdentifier>osx-arm64</RuntimeIdentifier>

              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>

              <AssemblyName>BVST.Mac</AssemblyName>
              <RootNamespace>BVST.Mac</RootNamespace>

              <PublishSingleFile>false</PublishSingleFile>
              <SelfContained>false</SelfContained>
            </PropertyGroup>

          </Project>
          EOF

          cat > Program.cs <<'EOF'
          using System;

          Console.WriteLine("BVST macOS ARM64 migration project");
          Console.WriteLine($"Runtime: {System.Runtime.InteropServices.RuntimeInformation.RuntimeIdentifier}");
          Console.WriteLine($"OS: {System.Runtime.InteropServices.RuntimeInformation.OSDescription}");
          Console.WriteLine($"Architecture: {System.Runtime.InteropServices.RuntimeInformation.OSArchitecture}");
          EOF

          dotnet restore

          dotnet build \
            -c Release \
            -r osx-arm64

          dotnet publish \
            -c Release \
            -r osx-arm64 \
            --self-contained false \
            -o ../../build/BVST-Mac

      # --------------------------------------------------------
      # Upload macOS build skeleton
      # --------------------------------------------------------

      - name: Upload macOS ARM64 build skeleton
        uses: actions/upload-artifact@v4
        with:
          name: BVST-macOS-ARM64-skeleton
          path: |
            macos-port/
            build/BVST-Mac/
          if-no-files-found: error
          retention-days: 30
