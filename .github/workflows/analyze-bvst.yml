name: Analyze BVST for macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Download, Extract and Analyze BVST
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================

      - name: Install analysis tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            file \
            unzip \
            p7zip-full \
            unrar-free \
            binutils \
            xz-utils \
            zstd \
            jq \
            coreutils \
            findutils

          git lfs install

          echo "=========================================="
          echo "TOOLS"
          echo "=========================================="

          file --version
          7z i | head -10
          strings --version
          objdump --version | head -1

      # ============================================================
      # 3. DOWNLOAD LFS OBJECT
      # ============================================================

      - name: Download BVST LFS object
        run: |
          echo "Downloading Git LFS object..."

          git lfs pull --include="downloads/BVST_FILE"

          echo
          echo "=========================================="
          echo "LFS STATUS"
          echo "=========================================="

          git lfs status

          echo
          echo "=========================================="
          echo "FILE"
          echo "=========================================="

          ls -lh downloads/BVST_FILE

          echo
          echo "File type:"
          file downloads/BVST_FILE

          echo
          echo "SHA256:"
          sha256sum downloads/BVST_FILE

      # ============================================================
      # 4. VERIFY FILE
      # ============================================================

      - name: Verify BVST file
        run: |
          EXPECTED_SHA="65982ba6e43a06b0530100eb1e8c7edb52b4a15a2198b8b8c92d04717f3a884e"
          EXPECTED_SIZE="732396103"

          ACTUAL_SHA="$(sha256sum downloads/BVST_FILE | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s downloads/BVST_FILE)"

          echo "Expected SHA256:"
          echo "$EXPECTED_SHA"

          echo "Actual SHA256:"
          echo "$ACTUAL_SHA"

          echo
          echo "Expected size:"
          echo "$EXPECTED_SIZE"

          echo "Actual size:"
          echo "$ACTUAL_SIZE"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: SHA256 mismatch!"
            exit 1
          fi

          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "ERROR: File size mismatch!"
            exit 1
          fi

          echo
          echo "BVST_FILE verified successfully."

      # ============================================================
      # 5. CREATE ANALYSIS DIRECTORIES
      # ============================================================

      - name: Prepare analysis directories
        run: |
          rm -rf extracted
          rm -rf analysis

          mkdir -p extracted
          mkdir -p analysis

      # ============================================================
      # 6. IDENTIFY ARCHIVE
      # ============================================================

      - name: Identify archive format
        run: |
          TYPE="$(file -b downloads/BVST_FILE)"

          echo "$TYPE" > analysis/file-type.txt

          echo "========================================"
          echo "BVST ARCHIVE"
          echo "========================================"
          echo
          echo "File type:"
          echo "$TYPE"
          echo
          echo "Magic bytes:"
          xxd -l 64 downloads/BVST_FILE

      # ============================================================
      # 7. EXTRACT ARCHIVE
      # ============================================================

      - name: Extract BVST archive
        shell: bash
        run: |
          set -e

          TYPE="$(file -b downloads/BVST_FILE)"

          echo "Detected archive:"
          echo "$TYPE"

          if echo "$TYPE" | grep -qi "Zip archive"; then

            echo "Using unzip..."
            unzip -q downloads/BVST_FILE -d extracted

          elif echo "$TYPE" | grep -qi "7-zip archive"; then

            echo "Using 7z..."
            7z x downloads/BVST_FILE -oextracted -y

          elif echo "$TYPE" | grep -qi "RAR archive"; then

            echo "Using 7z..."
            7z x downloads/BVST_FILE -oextracted -y

          elif echo "$TYPE" | grep -qi "gzip compressed"; then

            echo "Using gzip/tar..."

            if tar -tzf downloads/BVST_FILE >/dev/null 2>&1; then
              tar -xzf downloads/BVST_FILE -C extracted
            else
              gzip -dc downloads/BVST_FILE > extracted/BVST_CONTENT
            fi

          elif echo "$TYPE" | grep -qi "XZ compressed"; then

            echo "Using xz/tar..."

            if tar -tJf downloads/BVST_FILE >/dev/null 2>&1; then
              tar -xJf downloads/BVST_FILE -C extracted
            else
              xz -dc downloads/BVST_FILE > extracted/BVST_CONTENT
            fi

          elif echo "$TYPE" | grep -qi "Zstandard compressed"; then

            echo "Using zstd/tar..."

            if tar --zstd -tf downloads/BVST_FILE >/dev/null 2>&1; then
              tar --zstd -xf downloads/BVST_FILE -C extracted
            else
              zstd -dc downloads/BVST_FILE > extracted/BVST_CONTENT
            fi

          elif echo "$TYPE" | grep -qi "POSIX tar archive"; then

            echo "Using tar..."
            tar -xf downloads/BVST_FILE -C extracted

          else

            echo "ERROR: Unknown archive format."
            echo "$TYPE"
            exit 1

          fi

          echo
          echo "Extraction complete."

          find extracted -type f | wc -l

      # ============================================================
      # 8. FILE TREE
      # ============================================================

      - name: Generate file tree
        run: |
          echo "# BVST File Tree" > analysis/file-tree.md
          echo >> analysis/file-tree.md

          echo '```text' >> analysis/file-tree.md

          find extracted -type f \
            -printf '%p\t%s bytes\n' \
            | sort \
            | head -10000 \
            >> analysis/file-tree.md

          echo '```' >> analysis/file-tree.md

      # ============================================================
      # 9. FILE STATISTICS
      # ============================================================

      - name: Generate file statistics
        run: |
          {
            echo "# BVST File Statistics"
            echo
            echo "## Total files"
            find extracted -type f | wc -l
            echo
            echo "## Total directories"
            find extracted -type d | wc -l
            echo
            echo "## Total extracted size"
            du -sh extracted
            echo
            echo "## Extensions"
            echo
            echo '```text'

            find extracted -type f \
              | awk '
                {
                  n=$0
                  sub(/^.*\//,"",n)

                  if (n !~ /\./) {
                    print "[no extension]"
                  } else {
                    sub(/^.*\./,"",n)
                    print tolower(n)
                  }
                }
              ' \
              | sort \
              | uniq -c \
              | sort -rn \
              | head -200

            echo '```'

          } > analysis/file-statistics.md

      # ============================================================
      # 10. FIND EXECUTABLES
      # ============================================================

      - name: Find executable files
        run: |
          {
            echo "# Executable Analysis"
            echo

            while IFS= read -r FILE; do

              TYPE="$(file -b "$FILE")"

              if echo "$TYPE" | grep -Eq \
                "ELF|PE32|Mach-O|executable|shared object"; then

                echo "## $FILE"
                echo
                echo "\`$TYPE\`"
                echo

                if command -v objdump >/dev/null 2>&1; then
                  objdump -f "$FILE" 2>/dev/null || true
                fi

                echo
              fi

            done < <(find extracted -type f)

          } > analysis/executables.md

      # ============================================================
      # 11. ARCHITECTURE DETECTION
      # ============================================================

      - name: Analyze CPU architectures
        run: |
          {
            echo "# CPU Architecture Analysis"
            echo

            while IFS= read -r FILE; do

              TYPE="$(file -b "$FILE")"

              if echo "$TYPE" | grep -Eq \
                "ELF|PE32|Mach-O|executable|shared object"; then

                echo "## $FILE"
                echo
                echo "\`$TYPE\`"
                echo

              fi

            done < <(find extracted -type f)

          } > analysis/architectures.md

      # ============================================================
      # 12. WINDOWS COMPONENTS
      # ============================================================

      - name: Detect Windows components
        run: |
          {
            echo "# Windows Components"
            echo

            find extracted -type f \( \
              -iname "*.exe" \
              -o -iname "*.dll" \
              -o -iname "*.msi" \
              -o -iname "*.bat" \
              -o -iname "*.cmd" \
              -o -iname "*.ps1" \
            \) \
            | sort

          } > analysis/windows-components.txt

      # ============================================================
      # 13. MACOS COMPONENTS
      # ============================================================

      - name: Detect macOS components
        run: |
          {
            echo "# macOS Components"
            echo

            find extracted -type f \( \
              -iname "*.dylib" \
              -o -iname "*.app" \
              -o -iname "*.framework" \
              -o -iname "*.bundle" \
            \) \
            | sort

          } > analysis/macos-components.txt

      # ============================================================
      # 14. FLASH / PEPPERFLASH
      # ============================================================

      - name: Detect Flash components
        run: |
          {
            echo "# Flash / PepperFlash Detection"
            echo

            find extracted -type f \( \
              -iname "*.swf" \
              -o -iname "*flash*" \
              -o -iname "*pepper*" \
              -o -iname "*ppapi*" \
            \) \
            | sort

            echo
            echo "## Binary strings"

            find extracted -type f \
              -size -200M \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                if strings "$FILE" 2>/dev/null \
                  | grep -Eiq \
                  "pepperflash|pepper.?flash|ppapi|shockwave|flashplayer"; then

                  echo
                  echo "### $FILE"

                  strings "$FILE" 2>/dev/null \
                    | grep -Ei \
                    "pepperflash|pepper.?flash|ppapi|shockwave|flashplayer" \
                    | head -50

                fi

              done

          } > analysis/flash.md

      # ============================================================
      # 15. ELECTRON / CHROMIUM / CEF
      # ============================================================

      - name: Detect Electron Chromium CEF
        run: |
          {
            echo "# Electron / Chromium / CEF"
            echo

            echo "## Filename matches"
            find extracted -type f \( \
              -iname "*electron*" \
              -o -iname "*chromium*" \
              -o -iname "*cef*" \
              -o -iname "chrome_elf*" \
              -o -iname "*.asar" \
            \) \
            | sort

            echo
            echo "## Binary strings"

            find extracted -type f \
              -size -200M \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                if strings "$FILE" 2>/dev/null \
                  | grep -Eiq \
                  "electron|chromium|libcef|chrome_elf|CEF"; then

                  echo
                  echo "### $FILE"

                  strings "$FILE" 2>/dev/null \
                    | grep -Ei \
                    "electron|chromium|libcef|chrome_elf|CEF" \
                    | head -50

                fi

              done

          } > analysis/electron-chromium.md

      # ============================================================
      # 16. QT DETECTION
      # ============================================================

      - name: Detect Qt
        run: |
          {
            echo "# Qt Detection"
            echo

            find extracted -type f \( \
              -iname "*Qt5*" \
              -o -iname "*Qt6*" \
              -o -iname "*QtCore*" \
              -o -iname "*QtGui*" \
              -o -iname "*QtWidgets*" \
            \) \
            | sort

            echo
            echo "## Strings"

            find extracted -type f \
              -size -200M \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                if strings "$FILE" 2>/dev/null \
                  | grep -Eiq \
                  "QtCore|QtGui|QtWidgets|Qt5|Qt6"; then

                  echo
                  echo "### $FILE"

                  strings "$FILE" 2>/dev/null \
                    | grep -Ei \
                    "QtCore|QtGui|QtWidgets|Qt5|Qt6" \
                    | head -30

                fi

              done

          } > analysis/qt.md

      # ============================================================
      # 17. GRAPHICS API DETECTION
      # ============================================================

      - name: Detect graphics APIs
        run: |
          {
            echo "# Graphics API Detection"
            echo

            echo "## DirectX"

            find extracted -type f \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                if strings "$FILE" 2>/dev/null \
                  | grep -Eiq \
                  "DirectX|Direct3D|d3d9|d3d10|d3d11|d3d12|dxgi"; then

                  echo "$FILE"

                fi

              done

            echo
            echo "## OpenGL"

            find extracted -type f \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                if strings "$FILE" 2>/dev/null \
                  | grep -Eiq \
                  "OpenGL|opengl32|GLX|WGL"; then

                  echo "$FILE"

                fi

              done

            echo
            echo "## Vulkan"

            find extracted -type f \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                if strings "$FILE" 2>/dev/null \
                  | grep -Eiq \
                  "Vulkan|vulkan-1|MoltenVK"; then

                  echo "$FILE"

                fi

              done

          } > analysis/graphics.md

      # ============================================================
      # 18. IMPORTANT FILE NAMES
      # ============================================================

      - name: Detect important files
        run: |
          {
            echo "# Important Files"
            echo

            find extracted -type f \( \
              -iname "package.json" \
              -o -iname "package-lock.json" \
              -o -iname "yarn.lock" \
              -o -iname "pnpm-lock.yaml" \
              -o -iname "Cargo.toml" \
              -o -iname "CMakeLists.txt" \
              -o -iname "Makefile" \
              -o -iname "*.vcxproj" \
              -o -iname "*.sln" \
              -o -iname "*.xcodeproj" \
              -o -iname "*.xcworkspace" \
              -o -iname "*.csproj" \
              -o -iname "*.py" \
              -o -iname "*.js" \
              -o -iname "*.ts" \
              -o -iname "*.cpp" \
              -o -iname "*.cc" \
              -o -iname "*.c" \
              -o -iname "*.h" \
              -o -iname "*.hpp" \
            \) \
            | sort

          } > analysis/source-and-build-files.txt

      # ============================================================
      # 19. SEARCH FOR MACOS / WINDOWS REFERENCES
      # ============================================================

      - name: Search platform references
        run: |
          {
            echo "# Platform References"
            echo

            find extracted -type f \
              -size -20M \
              -print0 \
              | while IFS= read -r -d '' FILE; do

                MATCHES="$(strings "$FILE" 2>/dev/null \
                  | grep -Ei \
                  "Windows|Win32|Win64|macOS|Mac OS X|Darwin|Linux|Ubuntu|ARM64|AArch64|x86_64|amd64|i386" \
                  | head -30 || true)"

                if [ -n "$MATCHES" ]; then

                  echo "## $FILE"
                  echo
                  echo '```text'
                  echo "$MATCHES"
                  echo '```'
                  echo

                fi

              done

          } > analysis/platform-references.md

      # ============================================================
      # 20. GENERATE SUMMARY
      # ============================================================

      - name: Generate summary
        run: |
          FILE_COUNT="$(find extracted -type f | wc -l)"
          DIR_COUNT="$(find extracted -type d | wc -l)"
          SIZE="$(du -sh extracted | cut -f1)"
          TYPE="$(cat analysis/file-type.txt)"

          cat > analysis/SUMMARY.md <<EOF
          # BVST Analysis

          Generated by GitHub Actions.

          ## Original file

          - File: \`downloads/BVST_FILE\`
          - Size: 732396103 bytes
          - SHA256: \`65982ba6e43a06b0530100eb1e8c7edb52b4a15a2198b8b8c92d04717f3a884e\`

          ## Archive

          \`\`\`
          $TYPE
          \`\`\`

          ## Extracted

          - Files: $FILE_COUNT
          - Directories: $DIR_COUNT
          - Extracted size: $SIZE

          ## Analysis

          - [File tree](file-tree.md)
          - [File statistics](file-statistics.md)
          - [Executables](executables.md)
          - [Architectures](architectures.md)
          - [Windows components](windows-components.txt)
          - [macOS components](macos-components.txt)
          - [Flash / PepperFlash](flash.md)
          - [Electron / Chromium / CEF](electron-chromium.md)
          - [Qt](qt.md)
          - [Graphics APIs](graphics.md)
          - [Source / build files](source-and-build-files.txt)
          - [Platform references](platform-references.md)

          ## macOS ARM64 assessment

          The reports above should be used to determine:

          1. Main executable
          2. Current CPU architecture
          3. Windows-only dependencies
          4. Flash/PepperFlash dependencies
          5. Electron/Chromium/CEF dependencies
          6. Qt dependencies
          7. Graphics API dependencies
          8. Available source code
          9. Build system
          10. Requirements for macOS ARM64

          ## Target

          **Apple Silicon / ARM64 / macOS 12 Monterey**
          EOF

      # ============================================================
      # 21. SHOW SUMMARY IN ACTION LOG
      # ============================================================

      - name: Show analysis summary
        run: |
          cat analysis/SUMMARY.md

          echo
          echo "=========================================="
          echo "EXECUTABLES"
          echo "=========================================="

          cat analysis/executables.md

          echo
          echo "=========================================="
          echo "ARCHITECTURES"
          echo "=========================================="

          cat analysis/architectures.md

      # ============================================================
      # 22. COMMIT REPORTS
      # ============================================================

      - name: Commit analysis reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/

          if git diff --cached --quiet; then
            echo "No analysis changes."
            exit 0
          fi

          git commit -m "Analyze BVST archive for macOS"

          git push origin main

      # ============================================================
      # 23. UPLOAD REPORT AS ARTIFACT
      # ============================================================

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v6
        with:
          name: BVST-macOS-analysis
          path: analysis/
          retention-days: 30
